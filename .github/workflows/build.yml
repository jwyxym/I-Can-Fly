name: build

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
    
jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK and NDK
      uses: android-actions/setup-android@v4
      with:
        accept-android-sdk-licenses: true
        packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

    - name: Set Android Environment
      run: |
        echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_ROOT" >> $GITHUB_ENV
        echo "NDK_HOME=$ANDROID_NDK_ROOT" >> $GITHUB_ENV
        echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
        echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> $GITHUB_PATH
        NDK_SYSROOT="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
        echo "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=$NDK_SYSROOT -isystem $NDK_SYSROOT/usr/include -isystem $NDK_SYSROOT/usr/include/$BINDGEN_TARGET_INCLUDE" >> $GITHUB_ENV

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.18.0'

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.95.0

    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: './src-tauri -> target'

    - name: Write Tauri Config
      env:
        TAURI_BUILD_VERSION: ${{ github.ref_name }}
      run: |
        node .github/scripts/write-tauri-config.cjs

    - name: Write .env
      env:
        VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      run: |
        node -e "const value = process.env.VITE_API_BASE_URL?.trim(); if (!value) throw new Error('Missing VITE_API_BASE_URL secret'); require('node:fs').writeFileSync('.env', 'VITE_API_BASE_URL=' + JSON.stringify(value) + '\n', 'utf8');"

    - name: NPM Init
      run: |
        npm ci
        npm run tauri android init
        npm run icon

    - name: Install wget and unzip
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip

    - name: Download so
      run: |
        set -euo pipefail
        download_dir="$RUNNER_TEMP/xray-android"
        mkdir -p "$download_dir"
        for abi in x86 x86_64 arm64-v8a armeabi-v7a; do
          archive="$download_dir/xray-shared-android-$abi.zip"
          destination="kotlin/src/main/jniLibs/$abi"
          mkdir -p "$destination"
          curl --fail --location --retry 3 \
            "https://github.com/jwyxym/Xray-core/releases/download/release-latest/xray-shared-android-$abi.zip" \
            --output "$archive"
          unzip -j -o "$archive" 'libxray.so' -d "$destination"
          test -s "$destination/libxray.so"
        done

    - name: Android build
      run: |
        npm run tauri:android:build:sh

    - name: Git Config
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "github-actions@github.com"

    - name: Set SSH Key
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519

    - name: Decode Keystore File
      run: |
        git clone ${{ secrets.KEYSTORE_REPO }} --depth 1 jks
        mv jks/icanfly.jks ./ICanFly.jks

    - name: Sign apk (${{ matrix.artifact_abi }})
      env:
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      run: |
        mkdir build
        apksigner sign --ks ./ICanFly.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out "./build/I Can Fly.apk" ./src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk

    - name: Upload (${{ matrix.artifact_abi }})
      uses: actions/upload-artifact@v4
      with:
        name: "I Can Fly.apk"
        retention-days: 1
        path: "./build/I Can Fly.apk"

  build-windows:
    name: build-windows
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.18.0'

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.95.0

    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: './src-tauri -> target'

    - name: Install wget and unzip
      run: choco install wget unzip -y

    - name: Download So
      run: |
        cd src-tauri
        wget https://github.com/jwyxym/Xray-core/releases/download/release-latest/xray-shared-windows-amd64.zip
        unzip xray-shared-windows-amd64.zip

    - name: Write Tauri Config
      shell: cmd
      env:
        TAURI_BUILD_VERSION: ${{ github.ref_name }}
      run: |
        node .github/scripts/write-tauri-config.cjs

    - name: Write .env
      env:
        VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      run: |
        node -e "const value = process.env.VITE_API_BASE_URL?.trim(); if (!value) throw new Error('Missing VITE_API_BASE_URL secret'); require('node:fs').writeFileSync('.env', 'VITE_API_BASE_URL=' + JSON.stringify(value) + '\n', 'utf8');"

    - name: NPM Init
      run: |
        npm ci
        npm run icon

    - name: Windows build
      run: |
        npm run tauri:build
    
    - name: Copy
      shell: cmd
      run: |
        set "found_msi="
        set "found_exe="
        mkdir build

        for %%f in (.\src-tauri\target\release\bundle\msi\*) do (
            if not defined found_msi (
                copy "%%f" ".\build\I Can Fly.msi"
                set "found_msi=1"
            )
        )

        for %%f in (.\src-tauri\target\release\bundle\nsis\*) do (
            if not defined found_exe (
                copy "%%f" ".\build\I Can Fly.exe"
                set "found_exe=1"
            )
        )

    - name: Upload File
      uses: actions/upload-artifact@v4
      with:
        name: "I Can Fly.exe"
        retention-days: 1
        path: ".\\build\\I Can Fly.exe"

    - name: Upload File
      uses: actions/upload-artifact@v4
      with:
        name: "I Can Fly.msi"
        retention-days: 1
        path: ".\\build\\I Can Fly.msi"

  create-release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: build

      - name: Create release-latest
        run: |
          cd build
          gh release delete release-latest --cleanup-tag -y || true
          gh release create release-latest $(find . -type f) \
            --target "$GITHUB_SHA" \
            --title "release-latest" \
            --notes "Latest build for ${{ github.ref_name }}" \
            --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
